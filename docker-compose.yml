services:
  # PostgreSQL — the shared cross-module store.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: malware
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data

  # Zeek — authoritative PCAP protocol/connection parser.
  # Run on demand:  docker compose run --rm zeek
  zeek:
    image: zeek/zeek:latest
    volumes:
      - ./data:/pcap
      - ./output/zeek:/logs
    working_dir: /logs
    entrypoint: ["zeek", "-r", "/pcap/sample_infostealer.pcap"]

  # Suricata — signature-based alerting (ET Open ruleset).
  # Run on demand:  docker compose run --rm suricata
  suricata:
    image: jasonish/suricata:latest
    volumes:
      - ./data:/pcap
      - ./output/suricata:/var/log/suricata
    command: ["-r", "/pcap/sample_infostealer.pcap"]

volumes:
  pgdata:
